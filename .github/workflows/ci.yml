name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The unit tests cover the pure functions that fail *quietly*: the access
      # gate, the Stripe mapping and the route geometry. Each of them can be
      # wrong without anything erroring, which is why they get a test and the
      # code that talks to Supabase or Stripe does not — that code complains on
      # its own. No keys are needed; nothing here reaches the network.
      - name: Test
        run: npm test

      # The build runs with no Supabase or Stripe keys, which is deliberate:
      # it proves the app still compiles and prerenders in demo mode, so a
      # missing secret can never be what breaks a deploy.
      - name: Build
        run: npm run build
